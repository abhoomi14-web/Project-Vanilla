<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A focused, device-local note-taking workspace." />
    <title>Nova Notes</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23101222'/%3E%3Cpath d='M20 17h24v30H20z' fill='%23ffbd59'/%3E%3Cpath d='M26 26h12M26 33h12M26 40h8' stroke='%23101222' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar">
        <header class="brand-row">
          <div class="brand"><span class="brand-mark" aria-hidden="true">✦</span><span>NOVA NOTES</span></div>
          <button class="icon-button mobile-only" id="close-sidebar" type="button" aria-label="Close notes list">×</button>
        </header>

        <button class="new-note" id="new-note" type="button"><span>＋</span> New note</button>
        <label class="search-wrap">
          <span class="sr-only">Search notes</span>
          <span aria-hidden="true">⌕</span>
          <input id="search" type="search" placeholder="Search your notes" autocomplete="off" />
        </label>
        <div class="list-heading"><span>Notes</span><span id="note-count">0</span></div>
        <div class="note-list" id="note-list" aria-label="Saved notes"></div>
        <p class="storage-note">Saved privately on this device</p>
      </aside>

      <section class="workspace">
        <header class="workspace-bar">
          <button class="icon-button mobile-only" id="open-sidebar" type="button" aria-label="Open notes list">☰</button>
          <span class="save-status" id="save-status">All changes saved</span>
          <div class="actions">
            <button class="text-button" id="pin-note" type="button" aria-pressed="false">Pin</button>
            <button class="text-button danger" id="delete-note" type="button">Delete</button>
          </div>
        </header>
        <article class="editor" id="editor">
          <input id="note-title" class="title-input" type="text" maxlength="100" placeholder="Untitled note" aria-label="Note title" />
          <div class="note-meta" id="note-meta">Start writing whenever you’re ready</div>
          <textarea id="note-body" placeholder="Write something worth remembering…" aria-label="Note content"></textarea>
        </article>
        <section class="empty-state" id="empty-state" hidden>
          <span aria-hidden="true">✦</span>
          <h1>No note selected</h1>
          <p>Create a note to begin.</p>
          <button class="new-note compact" id="empty-new-note" type="button">Create note</button>
        </section>
      </section>
    </main>
    <div class="backdrop" id="backdrop" hidden></div>
    <script src="app.js"></script>
  </body>
</html>
