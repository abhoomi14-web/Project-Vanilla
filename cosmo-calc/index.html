<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A playful, keyboard-friendly calculator for everyday arithmetic."
    />
    <title>CosmoCalc</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%2317122d'/%3E%3Cpath d='M17 23h30M17 41h30M24 16v14M40 34v14' stroke='%237fffd4' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-rounded, "Segoe UI", system-ui, sans-serif;
        background: #090713;
        color: #f7f4ff;
        font-synthesis: none;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        overflow-x: hidden;
        background:
          radial-gradient(circle at 18% 16%, rgba(123, 92, 255, 0.24), transparent 34rem),
          radial-gradient(circle at 82% 80%, rgba(26, 230, 182, 0.14), transparent 30rem),
          #090713;
      }

      button, input { font: inherit; }

      .page {
        width: min(100%, 1100px);
        min-height: 100vh;
        margin: 0 auto;
        padding: clamp(1.25rem, 4vw, 3.75rem);
        display: grid;
        grid-template-columns: minmax(0, 0.8fr) minmax(310px, 430px);
        gap: clamp(2rem, 7vw, 6rem);
        align-items: center;
      }

      .intro { max-width: 34rem; }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 0.7rem;
        margin-bottom: 3rem;
        color: #bfb5ff;
        font-size: 0.9rem;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .brand-mark {
        display: grid;
        place-items: center;
        width: 2rem;
        height: 2rem;
        border: 1px solid rgba(127, 255, 212, 0.55);
        border-radius: 0.7rem;
        background: rgba(127, 255, 212, 0.1);
        box-shadow: 0 0 1.25rem rgba(127, 255, 212, 0.15);
        color: #7fffd4;
      }

      h1 {
        margin: 0;
        max-width: 9ch;
        font-size: clamp(3.3rem, 8vw, 6.5rem);
        line-height: 0.9;
        letter-spacing: -0.065em;
      }

      h1 span {
        display: block;
        color: #7fffd4;
      }

      .intro p {
        max-width: 30rem;
        margin: 1.75rem 0 0;
        color: #aaa2bf;
        font-size: 1rem;
        line-height: 1.7;
      }

      .key-hint {
        display: inline-flex;
        gap: 0.5rem;
        align-items: center;
        margin-top: 2rem;
        color: #777087;
        font-size: 0.875rem;
      }

      kbd {
        padding: 0.2rem 0.5rem;
        border: 1px solid #39334f;
        border-bottom-width: 2px;
        border-radius: 0.4rem;
        background: #151126;
        color: #d8d1eb;
        font: 700 0.75rem ui-monospace, SFMono-Regular, Consolas, monospace;
      }

      .calculator {
        position: relative;
        padding: clamp(1rem, 3vw, 1.5rem);
        border: 1px solid rgba(191, 181, 255, 0.16);
        border-radius: 2rem;
        background: linear-gradient(145deg, rgba(28, 23, 49, 0.98), rgba(15, 12, 27, 0.98));
        box-shadow: 0 2.5rem 6rem rgba(0, 0, 0, 0.45), inset 0 1px rgba(255,255,255,0.04);
      }

      .calculator::before {
        content: "";
        position: absolute;
        z-index: -1;
        inset: -1px;
        border-radius: inherit;
        background: linear-gradient(135deg, rgba(127,255,212,0.25), transparent 35%, rgba(123,92,255,0.25));
        filter: blur(18px);
        opacity: 0.7;
      }

      .display {
        min-height: 9.75rem;
        padding: 1.35rem 1.4rem;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: flex-end;
        overflow: hidden;
        border: 1px solid rgba(127, 255, 212, 0.16);
        border-radius: 1.35rem;
        background: #0c1220;
        box-shadow: inset 0 0 2.5rem rgba(127, 255, 212, 0.035);
      }

      .expression {
        width: 100%;
        min-height: 1.5rem;
        overflow: hidden;
        color: #7f7892;
        font-size: 0.95rem;
        text-align: right;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .result {
        width: 100%;
        margin-top: 0.45rem;
        overflow: hidden;
        color: #f8f6ff;
        font-size: clamp(2.25rem, 8vw, 3.5rem);
        font-weight: 750;
        letter-spacing: -0.05em;
        line-height: 1.1;
        text-align: right;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .message {
        width: 100%;
        min-height: 1.25rem;
        margin-top: 0.55rem;
        color: #7fffd4;
        font-size: 0.8rem;
        text-align: right;
      }

      .message.error { color: #ff8fb4; }

      .keypad {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 0.75rem;
        margin-top: 1rem;
      }

      .key {
        min-height: 4.25rem;
        border: 1px solid rgba(255,255,255,0.07);
        border-radius: 1.05rem;
        background: #262039;
        color: #f4f0ff;
        font-size: 1.1rem;
        font-weight: 760;
        cursor: pointer;
        transition: transform 120ms ease, background 120ms ease, border-color 120ms ease;
        -webkit-tap-highlight-color: transparent;
      }

      .key:hover { background: #302848; border-color: rgba(191,181,255,0.22); }
      .key:active, .key.pressed { transform: translateY(2px) scale(0.98); }
      .key:focus-visible { outline: 3px solid rgba(127,255,212,0.5); outline-offset: 2px; }
      .key.utility { color: #ffbad1; }
      .key.operator { background: #392f65; color: #cfc6ff; }
      .key.operator:hover { background: #493c7d; }
      .key.equals { background: #7fffd4; color: #081710; box-shadow: 0 0.8rem 2rem rgba(127,255,212,0.16); }
      .key.equals:hover { background: #a1ffe0; }
      .key.zero { grid-column: span 2; }

      .footer-note {
        grid-column: 1 / -1;
        margin: -1rem 0 0;
        color: #575166;
        font-size: 0.78rem;
        text-align: center;
      }

      @media (max-width: 760px) {
        .page {
          grid-template-columns: 1fr;
          gap: 2rem;
          padding-top: 2rem;
          padding-bottom: 2rem;
        }
        .intro { text-align: center; margin: 0 auto; }
        .brand { margin-bottom: 1.5rem; }
        h1 { max-width: none; font-size: clamp(3rem, 16vw, 4.8rem); }
        h1 span { display: inline; }
        .intro p { margin-inline: auto; }
        .key-hint { margin-top: 1.25rem; }
        .calculator { width: min(100%, 430px); margin: 0 auto; }
        .footer-note { margin-top: 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="intro" aria-labelledby="page-title">
        <div class="brand"><span class="brand-mark" aria-hidden="true">✦</span> CosmoCalc</div>
        <h1 id="page-title">Small sums. <span>Big energy.</span></h1>
        <p>A cheerful little number-cruncher for addition, subtraction, multiplication and division.</p>
        <div class="key-hint"><kbd>0–9</kbd><kbd>+ − × ÷</kbd><kbd>Enter</kbd><span>Keyboard ready</span></div>
      </section>

      <section class="calculator" aria-label="Calculator">
        <div class="display" aria-live="polite" aria-atomic="true">
          <div class="expression" id="expression">Ready when you are</div>
          <div class="result" id="result">0</div>
          <div class="message" id="message">Choose a number to begin</div>
        </div>
        <div class="keypad" aria-label="Calculator keypad">
          <button class="key utility" type="button" data-action="clear" aria-label="Clear calculator">AC</button>
          <button class="key utility" type="button" data-action="backspace" aria-label="Delete last character">⌫</button>
          <button class="key operator" type="button" data-value="/" aria-label="Divide">÷</button>
          <button class="key operator" type="button" data-value="*" aria-label="Multiply">×</button>

          <button class="key" type="button" data-value="7">7</button>
          <button class="key" type="button" data-value="8">8</button>
          <button class="key" type="button" data-value="9">9</button>
          <button class="key operator" type="button" data-value="-" aria-label="Subtract">−</button>

          <button class="key" type="button" data-value="4">4</button>
          <button class="key" type="button" data-value="5">5</button>
          <button class="key" type="button" data-value="6">6</button>
          <button class="key operator" type="button" data-value="+" aria-label="Add">+</button>

          <button class="key" type="button" data-value="1">1</button>
          <button class="key" type="button" data-value="2">2</button>
          <button class="key" type="button" data-value="3">3</button>
          <button class="key equals" type="button" data-action="equals" aria-label="Calculate result">=</button>

          <button class="key zero" type="button" data-value="0">0</button>
          <button class="key" type="button" data-value=".">.</button>
        </div>
      </section>
      <p class="footer-note">Basic mode · Built for clean calculations</p>
    </main>

    <script>
      (() => {
        const expressionEl = document.querySelector('#expression');
        const resultEl = document.querySelector('#result');
        const messageEl = document.querySelector('#message');
        const keypad = document.querySelector('.keypad');
        const operators = ['+', '-', '*', '/'];
        let expression = '';
        let justCalculated = false;

        const pretty = (value) => value.replace(/\*/g, '×').replace(/\//g, '÷').replace(/-/g, '−');
        const currentNumber = () => expression.split(/[+\-*/]/).pop();

        function setMessage(text, isError = false) {
          messageEl.textContent = text;
          messageEl.classList.toggle('error', isError);
        }

        function render() {
          expressionEl.textContent = expression ? pretty(expression) : 'Ready when you are';
          if (!expression) resultEl.textContent = '0';
        }

        function clearAll() {
          expression = '';
          justCalculated = false;
          resultEl.textContent = '0';
          setMessage('Choose a number to begin');
          render();
        }

        function addValue(value) {
          const isOperator = operators.includes(value);

          if (justCalculated && !isOperator) expression = '';
          justCalculated = false;

          if (/\d/.test(value)) {
            if (expression.length >= 32) return setMessage('That expression is long enough', true);
            expression += value;
            setMessage('Keep going');
          } else if (value === '.') {
            if (currentNumber().includes('.')) return setMessage('One decimal point per number', true);
            expression += currentNumber() ? '.' : '0.';
            setMessage('Decimal added');
          } else if (isOperator) {
            if (!expression && value !== '-') return setMessage('Start with a number first', true);
            if (operators.includes(expression.at(-1))) {
              if (value === '-' && expression.at(-1) !== '-') expression += value;
              else expression = expression.slice(0, -1) + value;
              setMessage('Operator updated');
            } else {
              expression += value;
              setMessage('Now add the next number');
            }
          }

          render();
        }

        function tokenize(input) {
          const tokens = input.match(/(?:^|[+*/-])-?\d*\.?\d+|[+*/-]/g);
          if (!tokens) throw new Error('Enter a calculation first');
          const cleaned = [];
          let numberBuffer = '';
          for (let index = 0; index < input.length; index += 1) {
            const char = input[index];
            if (/\d|\./.test(char) || (char === '-' && (index === 0 || operators.includes(input[index - 1])))) {
              numberBuffer += char;
            } else if (operators.includes(char)) {
              if (!numberBuffer) throw new Error('Complete both sides of the operation');
              cleaned.push(Number(numberBuffer), char);
              numberBuffer = '';
            } else {
              throw new Error(`I don’t recognize “${char}”`);
            }
          }
          if (!numberBuffer || Number.isNaN(Number(numberBuffer))) throw new Error('Complete both sides of the operation');
          cleaned.push(Number(numberBuffer));
          return cleaned;
        }

        function evaluate(input) {
          const tokens = tokenize(input);
          for (let i = 1; i < tokens.length; i += 2) {
            if (tokens[i] === '*' || tokens[i] === '/') {
              if (tokens[i] === '/' && tokens[i + 1] === 0) throw new Error('Division by zero isn’t possible');
              const value = tokens[i] === '*' ? tokens[i - 1] * tokens[i + 1] : tokens[i - 1] / tokens[i + 1];
              tokens.splice(i - 1, 3, value);
              i -= 2;
            }
          }
          let total = tokens[0];
          for (let i = 1; i < tokens.length; i += 2) total = tokens[i] === '+' ? total + tokens[i + 1] : total - tokens[i + 1];
          return Number.isInteger(total) ? total : Number(total.toPrecision(12));
        }

        function calculate() {
          try {
            if (!expression) throw new Error('Enter a calculation first');
            const original = expression;
            const value = evaluate(expression);
            expressionEl.textContent = `${pretty(original)} =`;
            resultEl.textContent = String(value);
            expression = String(value);
            justCalculated = true;
            setMessage('Nice one!');
            return value;
          } catch (error) {
            setMessage(error.message, true);
            return null;
          }
        }

        function backspace() {
          expression = expression.slice(0, -1);
          justCalculated = false;
          setMessage(expression ? 'Last entry removed' : 'Choose a number to begin');
          render();
        }

        keypad.addEventListener('click', (event) => {
          const key = event.target.closest('button');
          if (!key) return;
          if (key.dataset.value) addValue(key.dataset.value);
          if (key.dataset.action === 'clear') clearAll();
          if (key.dataset.action === 'backspace') backspace();
          if (key.dataset.action === 'equals') calculate();
        });

        document.addEventListener('keydown', (event) => {
          const aliases = { 'x': '*', 'X': '*', '×': '*', '÷': '/', '−': '-' };
          const key = aliases[event.key] || event.key;
          let handled = true;
          if (/\d/.test(key) || operators.includes(key) || key === '.') addValue(key);
          else if (key === 'Enter' || key === '=') calculate();
          else if (key === 'Backspace') backspace();
          else if (key === 'Escape' || key === 'Delete') clearAll();
          else handled = false;

          if (handled) {
            event.preventDefault();
            const selector = key === 'Enter' || key === '=' ? '[data-action="equals"]' : key === 'Backspace' ? '[data-action="backspace"]' : `[data-value="${CSS.escape(key)}"]`;
            const button = document.querySelector(selector);
            if (button) {
              button.classList.add('pressed');
              window.setTimeout(() => button.classList.remove('pressed'), 110);
            }
          } else if (event.key.length === 1 && !event.ctrlKey && !event.metaKey && !event.altKey) {
            setMessage(`I don’t recognize “${event.key}” — try +, −, × or ÷`, true);
          }
        });

        if (document.modelContext?.registerTool) {
          const lifecycle = new AbortController();
          Promise.resolve(document.modelContext.registerTool({
            name: 'calculate_expression',
            title: 'Calculate expression',
            description: 'Calculate a basic arithmetic expression and show it in CosmoCalc.',
            inputSchema: {
              type: 'object',
              properties: { expression: { type: 'string', description: 'Arithmetic using +, -, *, or /.' } },
              required: ['expression'],
              additionalProperties: false
            },
            annotations: { readOnlyHint: false, untrustedContentHint: false },
            execute(input) {
              if (!input || typeof input.expression !== 'string') throw new Error('A string expression is required');
              expression = input.expression.replace(/\s/g, '').replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-');
              justCalculated = false;
              render();
              const value = calculate();
              if (value === null) throw new Error(messageEl.textContent);
              return { expression: input.expression, result: value };
            }
          }, { signal: lifecycle.signal })).catch(() => {});
        }
      })();
    </script>
  </body>
</html>
